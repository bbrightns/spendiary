name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails on high or critical advisories in the code that ships to the browser (dev tools excluded)
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run lint:design
      - run: npm test
      - run: npm run build
