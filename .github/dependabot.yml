# Weekly dependency updates. Security updates are turned on in the repo settings and arrive on their own.
# Only minor and patch bumps come automatically, as one PR per ecosystem. Major bumps (React, Vite, TypeScript,
# React Router, ESLint plugins…) usually need code changes, so they are planned and tested by hand instead.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
